services:
  - type: web
    name: telegram-signal-bot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: VIP_CHANNEL_ID
        sync: false
      - key: OWNER_ID
        sync: false
      - key: SUPPORT_USERNAME
        sync: false